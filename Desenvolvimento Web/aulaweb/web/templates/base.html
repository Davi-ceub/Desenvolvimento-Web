<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Base</title>

    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Menu de navegação */
        header {
            background: linear-gradient(90deg, #4a90e2, #007aff);
            padding: 15px 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: #fff;
            font-size: 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        nav ul li a:hover {
            opacity: 0.7;
        }

        /* Conteúdo principal */
        main {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Rodapé */
        footer {
            margin-top: 40px;
            background-color: #1c1c1c;
            color: #ccc;
            text-align: center;
            padding: 20px;
        }

        footer p {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Menu -->
    {% include 'menu.html' %}

    <!-- Conteúdo principal -->
    <main>
        <div class="card">
           {% block conteudo %} <!-- Conteúdo --> {% endblock %}
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 - Meu Site. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
